# Automatic code review of pull requests by Claude (anthropics/claude-code-action, code-review plugin).
# Authenticates to the Claude API with Workload Identity Federation (since 23.11.2026): the workflow's GitHub OIDC token
# is exchanged for a short-lived Anthropic access token, so no API key is stored in GitHub. The federation rule
# (Anthropic Console → Workload identity) matches pull_request runs of pnedzka/nutri_hub; the IDs below are not
# secrets. Needs `id-token: write` and the Claude GitHub App on this repository. Comments never block merging.
#
# Draft PRs are skipped: the review runs when a PR is marked "Ready for review". Release PRs (develop → main) and
# sync PRs (main → develop) are skipped too: their changes were reviewed on the way in.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.head_ref != 'develop' && github.head_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: fdrl_01Aiue1oAKvNWPTTNYsbHudw
          anthropic_organization_id: 0ff8c21a-4fc9-48c5-b246-f037e77669ae
          anthropic_service_account_id: svac_016XoZKYukjmwMiJXzAP3yTK
          anthropic_workspace_id: wrkspc_01LUP4esDZWx5L4kLQRDjEit
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
